<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligence360 Command Center</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d1b2e;
    --panel:     #132035;
    --panel2:    #1a2d47;
    --border:    #2a5298;
    --border-br: #3a6fc8;
    --gold:      #f5c842;
    --gold-dim:  #c9a52a;
    --text:      #e8f4ff;
    --dim:       #7ba7cc;
    --user-bg:   #162840;
    --ai-bg:     #0f1f35;
    --green:     #34e8a0;
    --red:       #ff6b7a;
    --blue:      #4dabf7;
    --scroll:    #2a529866;
    --input-bg:  #0a1525;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: var(--panel2);
    border-bottom: 1px solid var(--border-br);
    flex-shrink: 0;
    box-shadow: 0 1px 12px #0008;
  }
  .logo {
    color: var(--gold);
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .logo span { color: var(--dim); font-size: 11px; font-weight: normal; margin-left: 8px; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .ws-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .ws-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .ws-label { color: var(--dim); font-size: 11px; }
  .model-pill {
    background: #2a529822;
    border: 1px solid var(--border-br);
    border-radius: 20px;
    padding: 3px 12px;
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 0.5px;
  }

  /* ── Main layout ── */
  .layout {
    display: grid;
    grid-template-columns: 240px 1fr 220px;
    flex: 1;
    overflow: hidden;
  }

  /* ── Panels ── */
  .panel {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel:last-child { border-right: none; border-left: 1px solid var(--border); }
  .panel-title {
    padding: 9px 14px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--blue);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    background: var(--panel2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .live-badge {
    background: var(--green);
    color: #000;
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 10px;
    letter-spacing: 1px;
    font-weight: bold;
    display: none;
  }
  .live-badge.show { display: inline; }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--scroll) transparent;
  }

  /* ── Session list ── */
  .session-item {
    padding: 10px 14px;
    border-bottom: 1px solid #1a2d4744;
    cursor: pointer;
    transition: background 0.12s;
  }
  .session-item:hover { background: var(--panel2); }
  .session-item.active {
    background: var(--panel2);
    border-left: 2px solid var(--blue);
  }
  .session-id { color: var(--dim); font-size: 10px; margin-bottom: 3px; }
  .session-summary { color: var(--text); font-size: 12px; line-height: 1.4; word-break: break-word; }
  .session-time { color: var(--dim); font-size: 10px; margin-top: 3px; }

  .load-more-btn {
    width: calc(100% - 28px);
    margin: 8px 14px;
    padding: 7px;
    background: #2a529820;
    border: 1px solid var(--border);
    color: var(--blue);
    cursor: pointer;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    transition: background 0.15s;
    text-align: center;
  }
  .load-more-btn:hover { background: #2a529840; }

  /* ── Chat area ── */
  .chat-panel { border-right: none; display: flex; flex-direction: column; overflow: hidden; }
  .chat-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--dim);
  }
  .chat-empty .cat {
    font-size: 11px;
    color: var(--border-br);
    line-height: 1.4;
    white-space: pre;
    text-align: center;
  }
  #chatBody {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--scroll) transparent;
    min-height: 0;
  }
  #messages {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 6px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
    max-width: 100%;
    font-size: 13px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg-user {
    background: var(--user-bg);
    border-left: 2px solid var(--gold);
    align-self: flex-end;
    max-width: 88%;
    border: 1px solid #f5c84222;
    border-left: 2px solid var(--gold);
  }
  .msg-assistant {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-left: 2px solid var(--blue);
  }
  .msg-role {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 5px;
    color: var(--dim);
  }
  .msg-user .msg-role { color: var(--gold-dim); }
  .msg-assistant .msg-role { color: var(--blue); }

  /* ── Chat input ── */
  .chat-input-area {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel2);
    padding: 10px 14px;
    display: none;
    gap: 8px;
    align-items: flex-end;
  }
  .chat-input-area.visible { display: flex; }
  .chat-input-wrap { flex: 1; position: relative; }
  #chatInput {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 12px;
    resize: none;
    min-height: 38px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
  }
  #chatInput:focus { border-color: var(--border-br); }
  #chatInput::placeholder { color: var(--dim); }
  .send-btn {
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
    height: 38px;
  }
  .send-btn:hover { background: #ffd43b; }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

  /* ── Status panel ── */
  .status-section {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .status-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .model-badge {
    background: #2a529818;
    border: 1px solid var(--border-br);
    border-radius: 4px;
    padding: 6px 10px;
    color: var(--gold);
    font-size: 12px;
    word-break: break-all;
  }
  .provider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #2a529818;
  }
  .provider-row:last-child { border-bottom: none; }
  .provider-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    transition: box-shadow 0.3s;
  }
  .provider-dot.on  { background: var(--green); box-shadow: 0 0 5px var(--green); }
  .provider-dot.off { background: #2a3a4a; }
  .provider-name { flex: 1; color: var(--text); }
  .provider-name.off { color: var(--dim); }
  .provider-key { font-size: 10px; color: var(--dim); }

  .refresh-btn {
    width: 100%;
    padding: 7px;
    background: #2a529820;
    border: 1px solid var(--border);
    color: var(--blue);
    cursor: pointer;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 10px;
    transition: background 0.15s;
  }
  .refresh-btn:hover { background: #2a529840; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">◈ Intelligence360 <span>Command Center</span></div>
  <div class="header-right">
    <div class="model-pill" id="modelPill">—</div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="ws-dot" id="wsDot"></div>
      <span class="ws-label" id="wsLabel">connecting…</span>
    </div>
  </div>
</header>

<div class="layout">

  <!-- Sessions -->
  <div class="panel">
    <div class="panel-title">◈ Sessions</div>
    <div class="panel-body" id="sessionList">
      <div style="padding:20px;color:var(--dim);font-size:12px">Loading…</div>
    </div>
  </div>

  <!-- Chat -->
  <div class="panel chat-panel">
    <div class="panel-title" id="chatTitle">
      ◈ Chat
      <span class="live-badge" id="liveBadge">LIVE</span>
    </div>
    <div id="chatBody">
      <div class="chat-empty">
        <pre class="cat">   /\_____/\
  /  ◈   ◈  \
 ( ==  ◡  == )
  )  ~~~~~  (
 (__(__)___(__)__)</pre>
        <span>Select a session to view</span>
      </div>
    </div>
    <div class="chat-input-area" id="chatInputArea">
      <div class="chat-input-wrap">
        <textarea id="chatInput" rows="1" placeholder="Send a message to the CLI…"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Status -->
  <div class="panel">
    <div class="panel-title">◈ Status</div>
    <div class="panel-body">

      <div class="status-section">
        <div class="status-label">Active Model</div>
        <div class="model-badge" id="modelBadge">—</div>
      </div>

      <div class="status-section">
        <div class="status-label">Providers</div>
        <div id="providerList">
          <div style="color:var(--dim);font-size:12px">Loading…</div>
        </div>
      </div>

      <div style="padding:12px 14px">
        <button class="refresh-btn" onclick="loadStatus()">⟳ Refresh Status</button>
      </div>

    </div>
  </div>

</div>

<script>
  let ws, activeProject, activeSession
  let allSessions = []
  let shownCount = 3
  const PAGE_SIZE = 3

  // ── WebSocket ──────────────────────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(`ws://${location.host}`)
    const dot = document.getElementById('wsDot')
    const label = document.getElementById('wsLabel')

    ws.onopen = () => {
      dot.classList.add('connected')
      label.textContent = 'live'
    }
    ws.onclose = () => {
      dot.classList.remove('connected')
      label.textContent = 'disconnected'
      setTimeout(connect, 2000)
    }
    ws.onmessage = ({ data }) => {
      const ev = JSON.parse(data)
      if (ev.type === 'connected') {
        updateModel(ev.model)
        loadSessions()
        loadStatus()
      }
      if (ev.type === 'message' && ev.entry) {
        const role = ev.entry.type
        if (role === 'user' || role === 'assistant') {
          appendMessage(role, extractText(ev.entry))
        }
      }
      if (ev.type === 'model') {
        updateModel(ev.model)
      }
    }
  }

  function updateModel(model) {
    const m = model || '—'
    document.getElementById('modelBadge').textContent = m
    document.getElementById('modelPill').textContent = m
  }

  function extractText(entry) {
    const msg = entry.message || {}
    const content = msg.content
    if (typeof content === 'string') return content
    if (Array.isArray(content)) {
      return content.filter(b => b.type === 'text').map(b => b.text || '').join('\n').trim()
    }
    return ''
  }

  // ── Sessions ───────────────────────────────────────────────────────────────
  async function loadSessions() {
    const res = await fetch('/api/sessions')
    allSessions = await res.json()
    shownCount = PAGE_SIZE
    renderSessionList()
  }

  function renderSessionList() {
    const list = document.getElementById('sessionList')
    const visible = allSessions.slice(0, shownCount)

    if (!allSessions.length) {
      list.innerHTML = '<div style="padding:20px;color:var(--dim);font-size:12px">No sessions yet</div>'
      return
    }

    let html = visible.map(s => `
      <div class="session-item ${s.id === activeSession ? 'active' : ''}"
           onclick="loadSession('${esc(s.project)}','${esc(s.id)}')">
        <div class="session-id">${esc(s.id.slice(0,8))}…</div>
        <div class="session-summary">${esc(s.summary || '(empty)')}</div>
        <div class="session-time">${timeAgo(s.modified)}</div>
      </div>
    `).join('')

    if (shownCount < allSessions.length) {
      const remaining = allSessions.length - shownCount
      html += `<button class="load-more-btn" onclick="loadMoreSessions()">
        ↓ Show ${Math.min(PAGE_SIZE, remaining)} more (${remaining} left)
      </button>`
    }

    list.innerHTML = html
  }

  function loadMoreSessions() {
    shownCount += PAGE_SIZE
    renderSessionList()
  }

  async function loadSession(project, sessionId) {
    activeProject = project
    activeSession = sessionId

    document.getElementById('chatTitle').innerHTML =
      `◈ ${esc(sessionId.slice(0,8))}… <span class="live-badge show" id="liveBadge">LIVE</span>`

    renderSessionList()

    const res = await fetch(`/api/session/${encodeURIComponent(project)}/${encodeURIComponent(sessionId)}?watch=1`)
    const messages = await res.json()

    const body = document.getElementById('chatBody')
    body.innerHTML = '<div id="messages"></div>'
    body.style.overflowY = 'auto'

    for (const m of messages) {
      appendMessage(m.role, m.text)
    }
    body.scrollTop = body.scrollHeight

    // Show input area
    document.getElementById('chatInputArea').classList.add('visible')
  }

  function appendMessage(role, text) {
    if (!text.trim()) return
    const container = document.getElementById('messages')
    if (!container) return
    const div = document.createElement('div')
    div.className = `msg msg-${role}`
    div.innerHTML = `<div class="msg-role">${role === 'user' ? '▶ You' : '◈ Intelligence360'}</div>${esc(text)}`
    container.appendChild(div)
    const body = document.getElementById('chatBody')
    body.scrollTop = body.scrollHeight
  }

  // ── Send message to CLI ────────────────────────────────────────────────────
  function sendMessage() {
    const input = document.getElementById('chatInput')
    const text = input.value.trim()
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return

    ws.send(JSON.stringify({ type: 'input', text }))
    input.value = ''
    input.style.height = 'auto'
    input.focus()
  }

  // Auto-resize textarea + Enter to send (Shift+Enter for newline)
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('chatInput')
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        sendMessage()
      }
    })
    input.addEventListener('input', () => {
      input.style.height = 'auto'
      input.style.height = Math.min(input.scrollHeight, 120) + 'px'
    })
  })

  // ── Status ─────────────────────────────────────────────────────────────────
  async function loadStatus() {
    const res = await fetch('/api/status')
    const { model, providers } = await res.json()
    updateModel(model)
    document.getElementById('providerList').innerHTML = providers.map(p => `
      <div class="provider-row">
        <div class="provider-dot ${p.configured ? 'on' : 'off'}"></div>
        <div class="provider-name ${p.configured ? '' : 'off'}">${esc(p.name)}</div>
        <div class="provider-key">${p.configured ? '✓' : '✗'}</div>
      </div>
    `).join('')
  }

  // ── Utils ──────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>')
  }

  function timeAgo(ms) {
    const diff = Date.now() - ms
    if (diff < 60000) return 'just now'
    if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`
    return `${Math.floor(diff/86400000)}d ago`
  }

  // ── Start ──────────────────────────────────────────────────────────────────
  connect()
</script>
</body>
</html>
