<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligence360 Command Center</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #060f1e;
    --panel:     #0a1628;
    --panel2:    #0d1f38;
    --border:    #1e3a8a;
    --gold:      #f5c842;
    --gold-dim:  #b8941e;
    --text:      #e2e8f0;
    --dim:       #64748b;
    --user-bg:   #0f2a4a;
    --ai-bg:     #0a1628;
    --green:     #34d399;
    --red:       #f87171;
    --scroll:    #1e3a8a44;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    color: var(--gold);
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .logo span { color: var(--dim); font-size: 12px; font-weight: normal; margin-left: 8px; }
  .ws-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red); margin-left: auto;
    transition: background 0.3s;
  }
  .ws-dot.connected { background: var(--green); }
  .ws-label { color: var(--dim); font-size: 11px; }

  /* ── Main layout ── */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 230px;
    flex: 1;
    overflow: hidden;
  }

  /* ── Panels ── */
  .panel {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel:last-child { border-right: none; border-left: 1px solid var(--border); }
  .panel-title {
    padding: 10px 14px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    background: var(--panel2);
    flex-shrink: 0;
  }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--scroll) transparent;
  }

  /* ── Session list ── */
  .session-item {
    padding: 10px 14px;
    border-bottom: 1px solid #0d1f3844;
    cursor: pointer;
    transition: background 0.15s;
  }
  .session-item:hover { background: var(--panel2); }
  .session-item.active { background: var(--panel2); border-left: 2px solid var(--gold); }
  .session-id { color: var(--dim); font-size: 10px; margin-bottom: 3px; }
  .session-summary { color: var(--text); font-size: 12px; line-height: 1.4; word-break: break-word; }
  .session-time { color: var(--dim); font-size: 10px; margin-top: 3px; }

  /* ── Chat area ── */
  .chat-panel { border-right: none; }
  .chat-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--dim);
  }
  .chat-empty .cat {
    font-size: 11px;
    color: var(--border);
    line-height: 1.4;
    white-space: pre;
    text-align: center;
  }
  #messages {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 6px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
    max-width: 100%;
    font-size: 13px;
  }
  .msg-user {
    background: var(--user-bg);
    border-left: 2px solid var(--gold);
    align-self: flex-end;
    max-width: 85%;
  }
  .msg-assistant {
    background: var(--ai-bg);
    border-left: 2px solid var(--border);
    border: 1px solid #1e3a8a33;
  }
  .msg-role {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: var(--dim);
  }
  .msg-user .msg-role { color: var(--gold-dim); }
  .msg-assistant .msg-role { color: #60a5fa; }

  /* ── Status panel ── */
  .status-section {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .status-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .model-badge {
    background: #1e3a8a33;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    color: var(--gold);
    font-size: 12px;
    word-break: break-all;
  }
  .provider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #1e3a8a22;
  }
  .provider-row:last-child { border-bottom: none; }
  .provider-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .provider-dot.on  { background: var(--green); }
  .provider-dot.off { background: #374151; }
  .provider-name { flex: 1; color: var(--text); }
  .provider-name.off { color: var(--dim); }
  .provider-key { font-size: 10px; color: var(--dim); }

  .refresh-btn {
    width: 100%;
    padding: 7px;
    background: #1e3a8a22;
    border: 1px solid var(--border);
    color: var(--gold);
    cursor: pointer;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 12px;
    transition: background 0.15s;
  }
  .refresh-btn:hover { background: #1e3a8a55; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">◈ Intelligence360 <span>Command Center</span></div>
  <div style="display:flex;align-items:center;gap:6px">
    <div class="ws-dot" id="wsDot"></div>
    <span class="ws-label" id="wsLabel">connecting…</span>
  </div>
</header>

<div class="layout">

  <!-- Sessions -->
  <div class="panel">
    <div class="panel-title">Sessions</div>
    <div class="panel-body" id="sessionList">
      <div style="padding:20px;color:var(--dim);font-size:12px">Loading…</div>
    </div>
  </div>

  <!-- Chat -->
  <div class="panel chat-panel">
    <div class="panel-title" id="chatTitle">Chat</div>
    <div class="panel-body" id="chatBody">
      <div class="chat-empty">
        <pre class="cat">   /\_____/\
  /  ◈   ◈  \
 ( ==  ◡  == )
  )  ~~~~~  (
 (__(__)___(__)__)</pre>
        <span>Select a session to view</span>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="panel">
    <div class="panel-title">Status</div>
    <div class="panel-body">

      <div class="status-section">
        <div class="status-label">Active Model</div>
        <div class="model-badge" id="modelBadge">—</div>
      </div>

      <div class="status-section">
        <div class="status-label">Providers</div>
        <div id="providerList">
          <div style="color:var(--dim);font-size:12px">Loading…</div>
        </div>
      </div>

      <div style="padding:12px 14px">
        <button class="refresh-btn" onclick="loadStatus()">⟳ Refresh Status</button>
      </div>

    </div>
  </div>

</div>

<script>
  let ws, activeProject, activeSession

  // ── WebSocket ──────────────────────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(`ws://${location.host}`)
    const dot = document.getElementById('wsDot')
    const label = document.getElementById('wsLabel')

    ws.onopen = () => {
      dot.classList.add('connected')
      label.textContent = 'live'
    }
    ws.onclose = () => {
      dot.classList.remove('connected')
      label.textContent = 'disconnected'
      setTimeout(connect, 2000)
    }
    ws.onmessage = ({ data }) => {
      const ev = JSON.parse(data)
      if (ev.type === 'connected') {
        document.getElementById('modelBadge').textContent = ev.model || '—'
        loadSessions()
        loadStatus()
      }
      if (ev.type === 'message' && ev.entry) {
        const role = ev.entry.type
        if (role === 'user' || role === 'assistant') {
          appendMessage(role, extractText(ev.entry))
        }
      }
      if (ev.type === 'model') {
        document.getElementById('modelBadge').textContent = ev.model
      }
    }
  }

  function extractText(entry) {
    const msg = entry.message || {}
    const content = msg.content
    if (typeof content === 'string') return content
    if (Array.isArray(content)) {
      return content
        .filter(b => b.type === 'text')
        .map(b => b.text || '')
        .join('\n')
        .trim()
    }
    return ''
  }

  // ── Sessions ───────────────────────────────────────────────────────────────
  async function loadSessions() {
    const res = await fetch('/api/sessions')
    const sessions = await res.json()
    const list = document.getElementById('sessionList')
    if (!sessions.length) {
      list.innerHTML = '<div style="padding:20px;color:var(--dim);font-size:12px">No sessions yet</div>'
      return
    }
    list.innerHTML = sessions.map(s => `
      <div class="session-item ${s.id === activeSession ? 'active' : ''}"
           onclick="loadSession('${s.project}','${s.id}')">
        <div class="session-id">${s.id.slice(0,8)}…</div>
        <div class="session-summary">${esc(s.summary || '(empty)')}</div>
        <div class="session-time">${timeAgo(s.modified)}</div>
      </div>
    `).join('')
  }

  async function loadSession(project, sessionId) {
    activeProject = project
    activeSession = sessionId

    // Update sidebar highlight
    document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'))
    event.currentTarget.classList.add('active')

    document.getElementById('chatTitle').textContent = `Chat · ${sessionId.slice(0,8)}…`

    const res = await fetch(`/api/session/${project}/${sessionId}?watch=1`)
    const messages = await res.json()

    const body = document.getElementById('chatBody')
    body.innerHTML = '<div id="messages"></div>'

    for (const m of messages) {
      appendMessage(m.role, m.text)
    }
    body.scrollTop = body.scrollHeight
  }

  function appendMessage(role, text) {
    if (!text.trim()) return
    const container = document.getElementById('messages')
    if (!container) return
    const div = document.createElement('div')
    div.className = `msg msg-${role}`
    div.innerHTML = `<div class="msg-role">${role === 'user' ? '▶ You' : '◈ AI'}</div>${esc(text)}`
    container.appendChild(div)
    const body = document.getElementById('chatBody')
    body.scrollTop = body.scrollHeight
  }

  // ── Status ─────────────────────────────────────────────────────────────────
  async function loadStatus() {
    const res = await fetch('/api/status')
    const { model, providers } = await res.json()
    document.getElementById('modelBadge').textContent = model || '—'
    document.getElementById('providerList').innerHTML = providers.map(p => `
      <div class="provider-row">
        <div class="provider-dot ${p.configured ? 'on' : 'off'}"></div>
        <div class="provider-name ${p.configured ? '' : 'off'}">${p.name}</div>
        <div class="provider-key">${p.configured ? '✓' : '✗'}</div>
      </div>
    `).join('')
  }

  // ── Utils ──────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>')
  }

  function timeAgo(ms) {
    const diff = Date.now() - ms
    if (diff < 60000) return 'just now'
    if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`
    return `${Math.floor(diff/86400000)}d ago`
  }

  // ── Start ──────────────────────────────────────────────────────────────────
  connect()
</script>
</body>
</html>
